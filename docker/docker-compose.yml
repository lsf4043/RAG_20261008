# 启动：docker compose -f docker/docker-compose.yml up -d --build
# 前置：仓库根目录存在 .env（参考 .env.example），至少包含 DEEPSEEK_API_KEY / DASHSCOPE_API_KEY

services:
  rag-app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: rag-langgraph-v2
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    environment:
      # 容器内要访问宿主机的 Milvus，不能用 localhost
      - MILVUS_HOST=${MILVUS_HOST:-host.docker.internal}
      - MILVUS_PORT=${MILVUS_PORT:-19530}
      - MILVUS_COLLECTION=${MILVUS_COLLECTION:-RAG_20261008}
      # LangSmith 走 LANGSMITH_*（config.py 会映射给 SDK）
      - LANGSMITH_TRACING=${LANGSMITH_TRACING:-false}
      - LANGSMITH_API_KEY=${LANGSMITH_API_KEY:-}
      - LANGSMITH_PROJECT=${LANGSMITH_PROJECT:-RAG_20261008}
      - LOG_TO_FILE=false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # 模型缓存（重排模型重下载很慢，务必挂出来）
      - model-cache:/app/.cache/huggingface
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=5).status == 200 else sys.exit(1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # 可选：本地起一套 Milvus（单机版）。启用方式：docker compose --profile milvus up -d
  etcd:
    image: quay.io/coreos/etcd:v3.5.15
    profiles: ["milvus"]
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379
    volumes:
      - etcd-data:/etcd

  minio:
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    profiles: ["milvus"]
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    command: minio server /minio_data --console-address ":9001"
    volumes:
      - minio-data:/minio_data

  milvus:
    image: milvusdb/milvus:v2.4.15
    profiles: ["milvus"]
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - etcd
      - minio
    volumes:
      - milvus-data:/var/lib/milvus

volumes:
  model-cache:
  etcd-data:
  minio-data:
  milvus-data:
